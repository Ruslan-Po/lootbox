<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Loot Box</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="styles/variables.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/carousel.css" />
<link rel="stylesheet" href="styles/chest.css" />
<link rel="stylesheet" href="styles/modal.css" />
<link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
<div id="app">

  <section id="key-section">
    <div id="key-scroll"></div>
  </section>

  <section id="balance-section">
    <div id="balance-display"><span class="balance-label">BALANCE:</span> 300</div>
  </section>

  <section id="btn-section">
    <button id="open-btn" disabled>Open Chest</button>
  </section>

  <section id="chest-section">
    <div id="chest-wrap">
      <img id="chest-idle" src="assets/chest/chest_base.png" alt="Chest" />
      <div id="chest-idle-ph">📦</div>

      <video id="chest-video" muted playsinline preload="auto">
        <source src="assets/chest/chest.mp4" type="video/mp4">
      </video>

      <img id="chest-open" src="assets/chest/chest_base_open.png" alt="Open Chest" />
      <div id="chest-open-ph">✨📦✨</div>

      <canvas id="particle-canvas"></canvas>
    </div>
  </section>

</div>

<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-tier-name">
  <div id="modal-card">
    <div id="modal-tier-name">Iron Chest</div>
    <div id="modal-label">You received:</div>
    <div id="modal-value">0</div>
    <button id="collect-btn">Collect</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
