<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Loot Box</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Early-defined fallbacks so inline onerror works before body script loads
  function _chestIdleErr()  { var e=document.getElementById('chest-idle'),p=document.getElementById('chest-idle-ph'); if(e)e.style.display='none'; if(p)p.style.display='flex'; }
  function _chestOpenErr()  { var e=document.getElementById('chest-open'),p=document.getElementById('chest-open-ph'); if(e)e.style.display='none'; if(p)p.style.display='flex'; }
</script>
<style>
/* ── Reset & base ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #010123;
  --c-iron:     #8a8a8a;
  --c-bronze:   #cd7f32;
  --c-silver:   #c0c0c0;
  --c-gold:     #ffd700;
  --c-diamond:  #b9f2ff;
  --tier-color: #ffffff;
  --chest-size: 420px;
}



html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}

/* ── Key selector — top 20% ─────────────────────────────────────── */
#key-section {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  padding: 12px 0;
  position: relative;
  overflow: hidden;        /* clips carousel at edges for gradient */
}

/* gradient fade on left and right edges */
#key-section::before,
#key-section::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 80px;
  z-index: 3;
  pointer-events: none;
}
#key-section::before {
  left: 0;
  background: linear-gradient(to right, #010123 0%, transparent 100%);
}
#key-section::after {
  right: 0;
  background: linear-gradient(to left, #010123 0%, transparent 100%);
}

#key-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  /* центрируем первую и последнюю карточку: полвьюпорта − полкарточки (220px img + 16px padding) */
  padding: 0 calc(50% - 120px);
  width: 100%;
  align-items: center;
}
#key-scroll::-webkit-scrollbar { display: none; }

.key-item {
  flex: 0 0 auto;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  transition: none;   /* real-time via rAF, no CSS delay */
  opacity: 0.4;
  transform: scale(0.68);
  will-change: transform, opacity;
}

.key-item.active {
  opacity: 1;
  transform: scale(1);
}

.key-item img,
.key-item .key-ph {
  width: 220px;
  height: 220px;
  object-fit: contain;
  display: block;
}

.key-ph {
  display: flex !important;
  align-items: center;
  justify-content: center;
  font-size: 88px;
  border-radius: 10px;
}

.key-item .key-label {
  font-size: 11px;
  font-weight: 600;
  color: #bbb;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  line-height: 1.2;
}

.key-item .key-cost {
  font-size: 11px;
  color: #888;
  line-height: 1;
}

/* ── Balance — 10% ──────────────────────────────────────────────── */
#balance-section {
  flex: 0 0 10%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

#balance-display {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* ── Open button ────────────────────────────────────────────────── */
#btn-section {
  flex: 0 0 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
}

#open-btn {
  width: min(280px, 100%);
  height: 48px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #6e40c9, #a855f7);
  color: #fff;
  letter-spacing: 0.5px;
  transition: opacity 0.2s, transform 0.1s;
}
#open-btn:active:not(:disabled) { transform: scale(0.97); }
#open-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Chest section — rest of space ─────────────────────────────── */
#chest-section {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;           /* горизонтальный центр */
  justify-content: flex-start;   /* сундук ближе к кнопке */
  padding-top: clamp(8px, 2dvh, 20px);
  min-height: 0;
  position: relative;
}

/* Chest wrap: NO bg, NO border, NO border-radius */
#chest-wrap {
  position: relative;
  width: min(var(--chest-size), 90vw);
  aspect-ratio: 1 / 1;   /* always square — ensures PNG and video match */
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;         /* don't let flex crush the height */
}

#chest-idle,
#chest-video,
#chest-open {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#chest-idle  { display: block; }
#chest-video { mix-blend-mode: screen; display: none; }
#chest-open  { display: none;  }

/* Fallback placeholders (shown when image fails) */
#chest-idle-ph,
#chest-open-ph {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 96px;
}

/* Shake keyframe */
@keyframes chestShake {
  0%,100% { transform: translateX(0); }
  15%      { transform: translateX(-10px); }
  30%      { transform: translateX(10px); }
  45%      { transform: translateX(-7px); }
  60%      { transform: translateX(7px); }
  75%      { transform: translateX(-4px); }
  90%      { transform: translateX(4px); }
}
#chest-wrap.shaking { animation: chestShake 0.35s ease; }

/* Particle canvas — sits over the chest wrap */
#particle-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* ── Prize modal ────────────────────────────────────────────────── */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
#modal-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

#modal-card {
  background: #11152a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 40px 32px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: min(340px, 88vw);
  transform: scale(0);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity  0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#modal-overlay.visible #modal-card {
  transform: scale(1);
  opacity: 1;
}

#modal-tier-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--tier-color);
  letter-spacing: 0.5px;
}
#modal-label {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1.2px;
}
#modal-value {
  font-size: 88px;
  font-weight: 900;
  line-height: 1;
  color: var(--tier-color);
  text-shadow: 0 0 40px var(--tier-color);
}
#collect-btn {
  margin-top: 14px;
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #6e40c9, #a855f7);
  color: #fff;
  letter-spacing: 0.5px;
  transition: transform 0.1s;
}
#collect-btn:active { transform: scale(0.97); }

/* ── Mobile ─────────────────────────────────────────────────────── */
@media (max-width: 480px) {
  /* Cap key section so chest isn't pushed off screen */
  #key-section {
    max-height: 32dvh;
  }
  /* Smaller key images on mobile */
  .key-item img,
  .key-item .key-ph {
    width: 140px;
    height: 140px;
  }
  .key-ph { font-size: 56px; }
  /* Re-center carousel for smaller cards */
  #key-scroll {
    padding: 0 calc(50% - 80px);
  }
  /* Chest */
  #chest-wrap {
    width: min(var(--chest-size), 78vw);
  }
}

/* ── Reduced motion ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>
<div id="app">

  <!-- Key selector -->
  <section id="key-section">
    <div id="key-scroll"></div>
  </section>

  <!-- Balance -->
  <section id="balance-section">
    <div id="balance-display">🪙 1500</div>
  </section>

  <!-- Button -->
  <section id="btn-section">
    <button id="open-btn" disabled>Open Chest</button>
  </section>

  <!-- Chest -->
  <section id="chest-section">
    <div id="chest-wrap">
      <img id="chest-idle"
           src="assets/chest/chest_base.png"
           alt="Chest"
           onerror="_chestIdleErr()" />
      <div id="chest-idle-ph">📦</div>

      <video id="chest-video" muted playsinline preload="auto">
        <source src="assets/chest/chestanimation.webm" type="video/webm">
      </video>

      <img id="chest-open"
           src="assets/chest/chest_base_open.png"
           alt="Open Chest"
           onerror="_chestOpenErr()" />
      <div id="chest-open-ph">✨📦✨</div>

      <canvas id="particle-canvas"></canvas>
    </div>
  </section>

</div>

<!-- Prize modal -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-tier-name">
  <div id="modal-card">
    <div id="modal-tier-name">Iron Chest</div>
    <div id="modal-label">You received:</div>
    <div id="modal-value">0</div>
    <button id="collect-btn">Collect</button>
  </div>
</div>

<script>
'use strict';

// ── Telegram init ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (window.Telegram?.WebApp) Telegram.WebApp.ready();
});

// ── Tier data ────────────────────────────────────────────────────
const TIERS = [
  { id:'iron',    label:'Iron',    color:'#8a8a8a', bg:'#0d111d', cost:50,  pool:[1,2,3],    img:'assets/keys/iron.png' },
  { id:'bronze',  label:'Bronze',  color:'#cd7f32', bg:'#111321', cost:100, pool:[4,5,6],    img:'assets/keys/bronze.png' },
  { id:'silver',  label:'Silver',  color:'#c0c0c0', bg:'#060e1b', cost:200, pool:[7,8,9],    img:'assets/keys/silver.png' },
  { id:'gold',    label:'Gold',    color:'#ffd700', bg:'#11141f', cost:400, pool:[10,11,12], img:'assets/keys/gold.png' },
  { id:'diamond', label:'Diamond', color:'#b9f2ff', bg:'#07101e', cost:800, pool:[13,14,15], img:'assets/keys/diamond.png' },
];

// ── State ────────────────────────────────────────────────────────
let balance        = 1500;
let selectedIdx    = 0;   // always the centered key
let isAnimating    = false;

// ── DOM ──────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const keyScroll      = $('key-scroll');
const balanceDisplay = $('balance-display');
const openBtn        = $('open-btn');
const chestWrap      = $('chest-wrap');
const chestIdle      = $('chest-idle');
const chestIdlePh    = $('chest-idle-ph');
const chestVideo     = $('chest-video');
const chestOpen      = $('chest-open');
const chestOpenPh    = $('chest-open-ph');
const canvas         = $('particle-canvas');
const ctx            = canvas.getContext('2d');
const modalOverlay   = $('modal-overlay');
const modalTierName  = $('modal-tier-name');
const modalValue     = $('modal-value');
const collectBtn     = $('collect-btn');

// ── Chest state helpers ──────────────────────────────────────────
function imgOk(el) { return el.complete && el.naturalWidth > 0; }

function showIdle() {
  chestIdle.style.display  = imgOk(chestIdle) ? 'block' : 'none';
  chestIdlePh.style.display= imgOk(chestIdle) ? 'none'  : 'flex';
  chestVideo.style.display = 'none';
  chestOpen.style.display  = 'none';
  chestOpenPh.style.display= 'none';
}
function showVideo() {
  chestIdle.style.display  = 'none';
  chestIdlePh.style.display= 'none';
  chestVideo.style.display = 'block';
  chestOpen.style.display  = 'none';
  chestOpenPh.style.display= 'none';
}
function showOpenState() {
  chestIdle.style.display  = 'none';
  chestIdlePh.style.display= 'none';
  chestVideo.style.display = 'none';
  chestOpen.style.display  = imgOk(chestOpen) ? 'block' : 'none';
  chestOpenPh.style.display= imgOk(chestOpen) ? 'none'  : 'flex';
}

// ── Infinite key carousel ────────────────────────────────────────
const CLONES = 2;   // clones prepended and appended
let allCards  = []; // all DOM nodes including clones
let silentJump = false;

function makeCard(tier, tierIdx) {
  const item = document.createElement('div');
  item.className = 'key-item';
  item.dataset.tierIdx = tierIdx;
  item.style.background = tier.bg;

  const img = document.createElement('img');
  img.alt    = `${tier.label} key`;
  img.width  = 220;
  img.height = 220;
  img.onerror = () => {
    const ph = document.createElement('div');
    ph.className = 'key-ph';
    ph.style.background = tier.color + '22';
    ph.style.border     = `2px solid ${tier.color}44`;
    ph.textContent = '🗝️';
    img.replaceWith(ph);
  };
  img.src = tier.img;

  const label = document.createElement('div');
  label.className   = 'key-label';
  label.textContent = tier.label;

  const cost = document.createElement('div');
  cost.className   = 'key-cost';
  cost.textContent = `🪙 ${tier.cost}`;

  item.append(img, label, cost);
  item.addEventListener('click', () => {
    if (isAnimating) return;
    const i = allCards.indexOf(item);
    scrollToCard(i, true);
  });
  return item;
}

(function buildKeys() {
  const n = TIERS.length;
  // Prepend clones of last CLONES tiers
  for (let i = n - CLONES; i < n; i++) {
    const c = makeCard(TIERS[i], i);
    keyScroll.appendChild(c);
    allCards.push(c);
  }
  // Real items
  TIERS.forEach((tier, idx) => {
    const c = makeCard(tier, idx);
    keyScroll.appendChild(c);
    allCards.push(c);
  });
  // Append clones of first CLONES tiers
  for (let i = 0; i < CLONES; i++) {
    const c = makeCard(TIERS[i], i);
    keyScroll.appendChild(c);
    allCards.push(c);
  }

  // Start on first real item
  requestAnimationFrame(() => {
    scrollToCard(CLONES, false);
    updateVisuals(CLONES);
  });
})();

function scrollToCard(idx, animated) {
  const card = allCards[idx];
  const left = Math.max(0, card.offsetLeft - (keyScroll.clientWidth - card.offsetWidth) / 2);
  if (animated) {
    keyScroll.scrollTo({ left, behavior: 'smooth' });
  } else {
    keyScroll.scrollLeft = left; // truly instant — no animation, no snap delay
  }
}

function centeredCardIdx() {
  const mid = keyScroll.scrollLeft + keyScroll.clientWidth / 2;
  let best = 0, minDist = Infinity;
  allCards.forEach((card, i) => {
    const d = Math.abs(card.offsetLeft + card.offsetWidth / 2 - mid);
    if (d < minDist) { minDist = d; best = i; }
  });
  return best;
}

function updateVisuals(centeredIdx) {
  allCards.forEach((card, i) => {
    const dist = Math.abs(i - centeredIdx);
    if (dist === 0)      { card.style.transform = 'scale(1)';    card.style.opacity = '1'; }
    else if (dist === 1) { card.style.transform = 'scale(0.82)'; card.style.opacity = '0.65'; }
    else                 { card.style.transform = 'scale(0.68)'; card.style.opacity = '0.4'; }
    card.classList.toggle('active', i === centeredIdx);
  });
  selectedIdx = parseInt(allCards[centeredIdx].dataset.tierIdx);
  updateBtn();
}

// Real-time scale/opacity from scroll position — no delay
let scrollRaf = null;
let scrollTimer = null;

function updateVisualsRealtime() {
  const mid   = keyScroll.scrollLeft + keyScroll.clientWidth / 2;
  const cardW = allCards[0]?.offsetWidth || 240;

  allCards.forEach(card => {
    const cardMid = card.offsetLeft + card.offsetWidth / 2;
    const t = Math.min(Math.abs(cardMid - mid) / cardW, 2);
    // t=0 center, t=1 one away, t=2 two away
    const scale   = t <= 1 ? 1    + (0.82 - 1)    * t : 0.82 + (0.68 - 0.82) * (t - 1);
    const opacity = t <= 1 ? 1    + (0.65 - 1)    * t : 0.65 + (0.4  - 0.65) * (t - 1);
    card.style.transform = `scale(${scale.toFixed(3)})`;
    card.style.opacity   = opacity.toFixed(3);
  });
}

// Real-time visuals during scroll
keyScroll.addEventListener('scroll', () => {
  if (silentJump) return;
  if (scrollRaf) cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(updateVisualsRealtime);
}, { passive: true });

// Infinite loop jump — fire as soon as snap settles (scrollend),
// fallback to 80ms debounce for older browsers
function handleScrollEnd() {
  if (silentJump) return;
  const ci = centeredCardIdx();
  const n  = TIERS.length;

  allCards.forEach((c, i) => c.classList.toggle('active', i === ci));
  selectedIdx = parseInt(allCards[ci].dataset.tierIdx);
  updateBtn();

  if (ci < CLONES) {
    const realIdx = ci + n;
    silentJump = true;
    scrollToCard(realIdx, false);
    updateVisualsRealtime();
    requestAnimationFrame(() => { silentJump = false; });
  } else if (ci >= CLONES + n) {
    const realIdx = ci - n;
    silentJump = true;
    scrollToCard(realIdx, false);
    updateVisualsRealtime();
    requestAnimationFrame(() => { silentJump = false; });
  }
}

if ('onscrollend' in window) {
  keyScroll.addEventListener('scrollend', handleScrollEnd, { passive: true });
} else {
  // Fallback for browsers without scrollend
  keyScroll.addEventListener('scroll', () => {
    if (silentJump) return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(handleScrollEnd, 80);
  }, { passive: true });
}

// ── Balance animation ────────────────────────────────────────────
let rafBalance = null;

function animateBalance(to) {
  const from  = balance;
  let   start = null;
  if (rafBalance) cancelAnimationFrame(rafBalance);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    balance = to;
    balanceDisplay.textContent = `🪙 ${balance}`;
    return;
  }

  (function tick(ts) {
    if (!start) start = ts;
    const t   = Math.min((ts - start) / 400, 1);
    const e   = 1 - Math.pow(1 - t, 3);
    balanceDisplay.textContent = `🪙 ${Math.round(from + (to - from) * e)}`;
    if (t < 1) rafBalance = requestAnimationFrame(tick);
    else { balance = to; balanceDisplay.textContent = `🪙 ${balance}`; }
  })(performance.now());
}

function updateBtn() {
  openBtn.disabled = isAnimating || balance < TIERS[selectedIdx].cost;
}

// ── Canvas particles ─────────────────────────────────────────────
function syncCanvas() {
  const r = chestWrap.getBoundingClientRect();
  canvas.width  = r.width;
  canvas.height = r.height;
}
window.addEventListener('resize', syncCanvas);
syncCanvas();

function burstParticles(color) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  syncCanvas();

  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  const GLYPHS = ['🪙', '✨'];
  const pts = Array.from({ length: 40 }, () => {
    const ang   = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 5;
    return {
      x: cx, y: cy,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed - 1.5,
      alpha: 1,
      size: 14 + Math.random() * 10,
      glyph: GLYPHS[Math.random() > 0.5 ? 0 : 1],
      color,
    };
  });

  let raf;
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let any = false;
    for (const p of pts) {
      if (p.alpha <= 0) continue;
      any = true;
      p.x    += p.vx;
      p.y    += p.vy;
      p.vy   += 0.2;
      p.alpha = Math.max(0, p.alpha - 0.02);
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.font        = `${p.size}px serif`;
      ctx.textAlign   = 'center';
      ctx.textBaseline= 'middle';
      ctx.fillText(p.glyph, p.x, p.y);
      ctx.restore();
    }
    if (any) raf = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

// ── Modal ────────────────────────────────────────────────────────
function showModal(tier, value) {
  document.documentElement.style.setProperty('--tier-color', tier.color);
  modalTierName.textContent = `${tier.label} Chest`;
  modalValue.textContent    = value;
  modalOverlay.classList.add('visible');
}
function hideModal() { modalOverlay.classList.remove('visible'); }

collectBtn.addEventListener('click', () => {
  hideModal();
  showIdle();
  isAnimating = false;
  updateBtn();
});

// ── Open sequence ────────────────────────────────────────────────
function openChest() {
  if (isAnimating) return;
  const tier  = TIERS[selectedIdx];
  if (balance < tier.cost) return;

  isAnimating = true;
  openBtn.disabled = true;

  animateBalance(balance - tier.cost);
  const prize = tier.pool[Math.floor(Math.random() * tier.pool.length)];

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    showOpenState();
    showModal(tier, prize);
    return;
  }

  // Step 1: shake — timeout fallback because animationend is unreliable on iOS
  chestWrap.classList.add('shaking');
  let shakeFired = false;
  const shakeFallback = setTimeout(() => { if (!shakeFired) { shakeFired = true; afterShake(); } }, 450);
  chestWrap.addEventListener('animationend', function() {
    if (shakeFired) return;
    shakeFired = true;
    clearTimeout(shakeFallback);
    afterShake();
  }, { once: true });

  function afterShake() {
    chestWrap.classList.remove('shaking');

    // iOS Safari doesn't support WebM/VP9 — canPlayType returns '' → skip video
    const webmSupported = chestVideo.canPlayType('video/webm; codecs="vp9"') !== '' ||
                          chestVideo.canPlayType('video/webm') !== '';
    if (!webmSupported) {
      finish();
      return;
    }

    let videoDone = false;

    function cleanup() {
      chestVideo.removeEventListener('ended', onEnded);
      chestVideo.removeEventListener('error', onErr);
      clearTimeout(hardFallback);
    }
    function onEnded() { if (videoDone) return; videoDone = true; cleanup(); finish(); }
    function onErr()   { if (videoDone) return; videoDone = true; cleanup(); finish(); }

    const hardFallback = setTimeout(() => {
      if (!videoDone) { videoDone = true; cleanup(); finish(); }
    }, 5000);

    showVideo();
    chestVideo.currentTime = 0;
    chestVideo.addEventListener('ended', onEnded);
    chestVideo.addEventListener('error', onErr);

    const p = chestVideo.play();
    if (p !== undefined) {
      p.catch(() => { if (!videoDone) { videoDone = true; cleanup(); finish(); } });
    }
  }

  function finish() {
    showOpenState();
    burstParticles(tier.color);
    setTimeout(() => showModal(tier, prize), 100);
  }
}

openBtn.addEventListener('click', openChest);

// ── Init ─────────────────────────────────────────────────────────
balanceDisplay.textContent = `🪙 ${balance}`;

// Show idle chest once image is ready (may already be cached)
if (chestIdle.complete) {
  showIdle();
} else {
  chestIdle.addEventListener('load',  () => showIdle(), { once: true });
  chestIdle.addEventListener('error', () => showIdle(), { once: true }); // triggers placeholder path
}
</script>
</body>
</html>
